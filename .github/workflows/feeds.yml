# ดึง Traffy Fondue + ข่าวน้ำท่วมทุก 15 นาที แล้ววางไว้ที่ branch "data" (มี commit เดียว ไม่รก history)
name: feeds
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: feeds
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs out "https://raw.githubusercontent.com/${{ github.repository }}/data/traffy.json"
      - name: Publish to data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "feeds $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
